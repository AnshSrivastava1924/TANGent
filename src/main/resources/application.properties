spring.application.name=TANGent

# ==========================
# MySQL Configuration
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tangent_database}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:p3n3uda!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# Server Configuration
# ==========================
server.port=8080


# ==========================
# Logging
# ==========================
logging.level.org.springframework.jdbc=INFO

# ==========================
# Spring Data JDBC
# ==========================
spring.sql.init.mode=never
spring.data.jdbc.repositories.enabled=false

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================
# Swagger
# ==========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true
spring.web.resources.static-locations=classpath:/static/

# ==========================
# Market data providers
# ==========================
market.massive.api-key=${MASSIVE_API_KEY:YUgi_ODusFMhwzSXya_HsZmmwN0Md_IC}
market.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:RWY50J2QAVH5Q2GA}
market.alpha-vantage.entitlement=${ALPHA_VANTAGE_ENTITLEMENT:}
