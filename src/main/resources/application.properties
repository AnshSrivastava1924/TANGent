spring.application.name=portfolio-management

# ==========================
# MySQL Configuration
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/tangent_db
spring.datasource.username=root
spring.datasource.password=Project@22
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# Server Configuration
# ==========================
server.port=8080


# ==========================
# Logging
# ==========================
logging.level.org.springframework.jdbc=DEBUG

# ==========================
# Spring Data JDBC
# ==========================
spring.sql.init.mode=never

# ==========================
# JWT Configuration
# ==========================
jwt.secret=MySuperSecretKeyForPortfolioManagementProject2026JWTKey
jwt.expiration=86400000

# ==========================
# Swagger
# ==========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs