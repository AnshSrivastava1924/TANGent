spring.datasource.url=jdbc:h2:mem:tangent_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/dev-schema.sql
logging.level.org.springframework.jdbc=INFO

# Development-only key. Set JWT_SECRET in non-development environments.
jwt.secret=DevelopmentSecretKeyForTangentThatIsAtLeastThirtyTwoBytes
market.massive.api-key=${MASSIVE_API_KEY:}
market.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
